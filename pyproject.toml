[project]
name = "reviewpilot"
version = "0.1.0"
description = "Multi-agent GitHub pull request reviewer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "PyJWT[crypto]>=2.9.0",
    "PyYAML>=6.0.2",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-redis>=4.6.0",
    "types-PyYAML>=6.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
reviewpilot-worker = "app.services.worker:main"
reviewpilot-replay-dlq = "app.services.dlq:main"
reviewpilot-eval = "evals.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "agents", "evals"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "agents", "evals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["app", "agents", "evals"]

[[tool.mypy.overrides]]
module = ["redis", "redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app", "agents"]
branch = true
omit = ["app/services/worker.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
